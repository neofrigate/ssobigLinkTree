<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSOBIG Member Links</title>
    <link rel="stylesheet" href="./member-links.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./auth.js" defer></script>
    <script defer>
      const PROJECTS = [
        {
          code: "s3",
          group: "external",
          title: "쏘빅 홈페이지",
          description: "술 없이도 즐거운 소셜 플랫폼 쏘빅! 머더미스터리, 추리게임, 보드게임, 소셜링 등 다양한 콘텐츠를 만나보세요.",
          repo: "https://github.com/neofrigate/ssobig-home",
          service: "https://www.ssobig.com/",
          favicon: "./assets/member-links/favicons/s3.png",
          preview: "",
        },
        {
          code: "rank",
          group: "external",
          title: "머미랭크",
          description: "머미랭크는 머더 미스터리(머미) 티어표·랭킹 사이트예요. 해본 머미를 S~F로 평가해 나만의 티어표를 만들고, 인원별 추천작과 평점·후기, 취향이 비슷한 사람을 찾아보세요.",
          repo: "https://github.com/neofrigate/murder-mystery-rank",
          service: "https://mmrank.app/",
          favicon: "./assets/member-links/favicons/rank.png",
          preview: "./assets/member-links/previews/rank.jpg",
        },
        {
          code: "preview",
          group: "external",
          title: "쏘빅 미니게임 (프리뷰)",
          description: "SsoBig mini game campaign site.",
          repo: "https://github.com/as-surin/ssobig-preview",
          service: "https://preview.ssobig.com/",
          favicon: "./assets/member-links/favicons/preview.ico",
          preview: "",
        },
        {
          code: "writer",
          group: "external",
          title: "쏘빅 라이터",
          description: "미스터리 스토리 게임 제작 도구",
          repo: "https://github.com/neofrigate/writer-ssobig",
          service: "https://writer.ssobig.com/",
          favicon: "./assets/member-links/favicons/writer.svg",
          preview: "",
        },
        {
          code: "s4",
          group: "internal",
          title: "쏘빅 데이터 스크래핑",
          description: "",
          repo: "https://github.com/neofrigate/ssobig-marketing",
          service: "https://relay.ssobig.com/",
          favicon: "./assets/member-links/favicons/s4.png",
          preview: "",
        },
        {
          code: "s5",
          group: "internal",
          title: "쏘빅 오프라인 관리",
          description: "",
          repo: "https://github.com/neofrigate/ssobig_appscript",
          service: "https://manage.ssobig.com/",
          favicon: "./assets/member-links/favicons/s5.svg",
          preview: "",
        },
        {
          code: "s6",
          group: "internal",
          title: "쏘빅 스토리 관리",
          description: "",
          repo: "https://github.com/soopeach22/ssobig-story",
          service: "https://manage-story.ssobig.com/",
          favicon: "./assets/member-links/favicons/s6.svg",
          preview: "",
        },
        {
          code: "s10",
          group: "internal",
          title: "쏘빅 파이낸스",
          description: "",
          repo: "https://github.com/neofrigate/ssobig-finance",
          service: "https://finance.ssobig.com/",
          favicon: "./assets/member-links/favicons/s10.svg",
          preview: "",
        },
        {
          code: "docs",
          group: "internal",
          title: "쏘빅 문서 (Docs)",
          description: "쏘빅의 지식과 기록을 함께 나누는 공간",
          repo: "https://github.com/neofrigate/ssobig-docs",
          service: "https://docs.ssobig.com/",
          favicon: "",
          preview: "",
        },
        {
          code: "office",
          group: "internal",
          title: "쏘빅 오피스",
          description: "SSOBIG의 사람과 문서를 연결하는 사내 업무 공간",
          repo: "https://github.com/as-surin/ssobig-office",
          service: "https://ssobig-office.vercel.app/",
          favicon: "",
          preview: "./assets/member-links/previews/office.jpg",
        },
        {
          code: "movie",
          group: "internal",
          title: "쏘빅 무비 제너레이터",
          description: "",
          repo: "https://github.com/neofrigate/ssobig-movie-generator",
          service: "https://github.com/neofrigate/ssobig-movie-generator",
          favicon: "./assets/member-links/favicons/movie.ico",
          preview: "",
        },
      ];

      function displayUrl(url) {
        const { hostname, pathname } = new URL(url);
        return (hostname.replace(/^www\./, "") + pathname).replace(/\/$/, "");
      }

      function renderIcon(project) {
        const initial = project.title.replace(/^쏘빅\s*/, "").charAt(0);
        // 파비콘이 없거나 불러오지 못하면 이름 첫 글자로 대신한다.
        const fallback = `<span class="project-card__initial">${initial}</span>`;
        if (!project.favicon) return fallback;
        return `<img src="${project.favicon}" alt="" loading="lazy" onerror="this.parentElement.classList.add('is-fallback')" />${fallback}`;
      }

      function renderPreview(project) {
        if (project.preview) {
          return `<img src="${project.preview}" alt="${project.title} 미리보기" loading="lazy" />`;
        }
        // og:image가 없는 사이트는 링크 공유 때도 이미지가 안 보이므로 그대로 알려준다.
        return `<span class="project-card__empty">미리보기 없음</span>`;
      }

      const GROUPS = [
        { key: "external", title: "외부용", description: "고객과 작가가 쓰는 공개 서비스" },
        { key: "internal", title: "내부용", description: "쏘빅 멤버만 쓰는 운영·관리 도구" },
      ];

      function renderCard(project) {
        const hasService = project.service !== project.repo;
        return `
          <article class="project-card">
            <a class="project-card__preview" href="${project.service}" target="_blank" rel="noreferrer" tabindex="-1" aria-hidden="true">
              ${renderPreview(project)}
            </a>
            <div class="project-card__text">
              <div class="project-card__site">
                <span class="project-card__favicon">${renderIcon(project)}</span>
                <span class="project-card__url">${displayUrl(project.service)}</span>
                <span class="project-card__code">${project.code}</span>
              </div>
              <div class="project-card__title">${project.title}</div>
              ${project.description ? `<p class="project-card__description">${project.description}</p>` : ""}
            </div>
            <div class="project-card__actions">
              ${hasService ? `<a class="project-card__link project-card__link--primary" href="${project.service}" target="_blank" rel="noreferrer">Open</a>` : ""}
              <a class="project-card__link" href="${project.repo}" target="_blank" rel="noreferrer">GitHub</a>
            </div>
          </article>
        `;
      }

      function renderProjects() {
        const container = document.getElementById("projectGroups");
        container.innerHTML = GROUPS.map((group) => {
          const projects = PROJECTS.filter((project) => project.group === group.key);
          return `
            <section class="project-group" aria-labelledby="group-${group.key}">
              <div class="project-group__head">
                <h2 id="group-${group.key}" class="project-group__title">${group.title}</h2>
                <span class="project-group__count">${projects.length}</span>
                <p class="project-group__description">${group.description}</p>
              </div>
              <div class="project-list">${projects.map(renderCard).join("")}</div>
            </section>
          `;
        }).join("");
      }

      function showLogin() {
        document.getElementById("loginScreen").style.display = "flex";
        document.getElementById("accessDenied").style.display = "none";
        document.getElementById("mainContent").style.display = "none";
      }

      function showDenied() {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("accessDenied").style.display = "flex";
        document.getElementById("mainContent").style.display = "none";
      }

      function showMain(user) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("accessDenied").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
        document.getElementById("userEmail").textContent = user.email || "";
      }

      async function syncAccess(session) {
        const user = session?.user || (await window.SsobigAuth.getUser());

        if (!user) {
          showLogin();
          return;
        }

        if (!window.SsobigAuth.isSsobigEmail(user.email)) {
          showDenied();
          setTimeout(() => {
            window.SsobigAuth.signOut();
          }, 1600);
          return;
        }

        showMain(user);
      }

      document.addEventListener("DOMContentLoaded", async () => {
        renderProjects();

        await window.SsobigAuth.waitForSession();
        await syncAccess(await window.SsobigAuth.getSession());

        window.SsobigAuth.onAuthStateChange(async (_event, session) => {
          await syncAccess(session);
        });
      });
    </script>
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <a class="topbar__back" href="./index.html">메인으로 돌아가기</a>
        <div class="topbar__title">SSOBIG Members Only</div>
      </div>

      <div id="loginScreen" class="login-screen">
        <section class="login-card">
          <h2>쏘빅멤버용 링크</h2>
          <p>@ssobig.com Google 계정으로 로그인한 멤버만 볼 수 있습니다.</p>
          <button class="auth-button" onclick="window.SsobigAuth.signIn()">Google로 로그인</button>
        </section>
      </div>

      <div id="accessDenied" class="access-denied">
        <section class="access-card">
          <h2>접근할 수 없습니다</h2>
          <p>@ssobig.com 계정만 접근할 수 있습니다. 잠시 후 자동으로 로그아웃됩니다.</p>
        </section>
      </div>

      <main id="mainContent" class="main-content">
        <section class="hero">
          <h1>쏘빅멤버용 링크</h1>
          <p>내부 운영용 프로젝트와 관리 페이지를 한 곳에서 확인할 수 있습니다.</p>
        </section>

        <div class="status-row">
          <div>로그인 계정: <span id="userEmail" class="user-email"></span></div>
          <button class="topbar__logout" onclick="window.SsobigAuth.signOut()">로그아웃</button>
        </div>

        <div id="projectGroups" class="project-groups"></div>
      </main>
    </div>
  </body>
</html>
