          repo: "https://github.com/neofrigate/murder-mystery-rank",
          service: "https://mmrank.app/",

        },
        {

        {

        },
        {

        {

        },
        {
          code: "office",
          businesses: ["hq"],
          group: "internal",
          title: "쏘빅 오피스",
          description: "SSOBIG의 사람과 문서를 연결하는 사내 업무 공간",
          repo: "https://github.com/as-surin/ssobig-office",
          service: "https://ssobig-office.vercel.app/",
          favicon: "",
          preview: "./assets/member-links/previews/office.jpg",
        },
        {
          code: "movie",
          businesses: ["hq"],
          group: "internal",
          title: "쏘빅 무비 제너레이터",
          description: "",
          repo: "https://github.com/neofrigate/ssobig-movie-generator",
          service: "https://github.com/neofrigate/ssobig-movie-generator",
          favicon: "./assets/member-links/favicons/movie.ico",
          preview: "",
        },
      ];

      function displayUrl(url) {
        const { hostname, pathname } = new URL(url);
        return (hostname.replace(/^www\./, "") + pathname).replace(/\/$/, "");
      }

      function renderIcon(project) {
        const initial = project.title.replace(/^쏘빅\s*/, "").charAt(0);
        // 파비콘이 없거나 불러오지 못하면 이름 첫 글자로 대신한다.
        const fallback = `<span class="project-card__initial">${initial}</span>`;
        if (!project.favicon) return fallback;
        return `<img src="${project.favicon}" alt="" loading="lazy" onerror="this.parentElement.classList.add('is-fallback')" />${fallback}`;
      }

      function renderPreview(project) {
        if (project.preview) {
          return `<img src="${project.preview}" alt="${project.title} 미리보기" loading="lazy" />`;
        }
        // og:image가 없는 사이트는 링크 공유 때도 이미지가 안 보이므로 그대로 알려준다.
        return `<span class="project-card__empty">미리보기 없음</span>`;
      }

      const GROUPS = [
        { key: "external", title: "외부용", description: "고객과 작가가 쓰는 공개 서비스" },
        { key: "internal", title: "내부용", description: "쏘빅 멤버만 쓰는 운영·관리 도구" },
      ];

      function renderCard(project) {
        // 서비스 주소가 곧 GitHub인 경우(무비 제너레이터)는 GitHub 줄을 따로 두지 않는다.
        const showRepo = project.repo && project.repo !== project.service;
        // 카드 전체가 제목 링크로 열리고, GitHub 링크만 그 위에 따로 눌린다.
        return `
          <article class="project-card">
            <div class="project-card__preview">${renderPreview(project)}</div>
            <div class="project-card__text">
              <div class="project-card__head">
                <span class="project-card__favicon">${renderIcon(project)}</span>
                <a class="project-card__title" href="${project.service}" target="_blank" rel="noreferrer">${project.title}</a>
                <button class="project-card__copy" type="button" data-url="${project.service}" aria-label="${project.title} 주소 복사" title="주소 복사">
                  <svg class="icon-copy" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5" /><path d="M10.5 3.5v-.5a1.5 1.5 0 0 0-1.5-1.5H4a1.5 1.5 0 0 0-1.5 1.5v5A1.5 1.5 0 0 0 4 9.5h.5" /></svg>
                  <svg class="icon-check" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" /></svg>
                </button>
                <span class="project-card__code">${project.code}</span>
              </div>
              ${project.description ? `<p class="project-card__description">${project.description}</p>` : ""}
              ${showRepo ? `<a class="project-card__repo" href="${project.repo}" target="_blank" rel="noreferrer">GitHub · ${displayUrl(project.repo)}</a>` : ""}
            </div>
          </article>
        `;
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch {
          // 클립보드 API를 못 쓰는 환경(권한 거부 등)에서는 예전 방식으로 복사한다.
          const field = document.createElement("textarea");
          field.value = text;
          field.setAttribute("readonly", "");
          field.style.position = "fixed";
          field.style.opacity = "0";
          document.body.appendChild(field);
          field.select();
          const copied = document.execCommand("copy");
          field.remove();
          return copied;
        }
      }

      async function handleCopy(button) {
        const copied = await copyText(button.dataset.url);
        button.classList.toggle("is-copied", copied);
        button.title = copied ? "복사됨" : "복사하지 못했습니다";
        document.getElementById("copyStatus").textContent = copied ? "주소를 복사했습니다." : "주소를 복사하지 못했습니다.";
        clearTimeout(button.resetTimer);
        button.resetTimer = setTimeout(() => {
          button.classList.remove("is-copied");
          button.title = "주소 복사";
        }, 1600);
      }

      const BUSINESSES = [
        { key: "hq", title: "본사" },
        { key: "offline", title: "오프라인" },
        { key: "tool", title: "쏘빅툴" },
      ];
      // Supabase 로그인이 주소의 #를 쓰므로, 선택한 탭은 브라우저 저장소에만 기억한다.
      const TAB_STORAGE_KEY = "member-links:business";

      function readSavedTab() {
        try {
          const saved = localStorage.getItem(TAB_STORAGE_KEY);
          return BUSINESSES.some((business) => business.key === saved) ? saved : BUSINESSES[0].key;
        } catch {
          return BUSINESSES[0].key;
        }
      }

      function renderGroups(businessKey) {
        return GROUPS.map((group) => {
          const projects = PROJECTS.filter((project) => project.businesses.includes(businessKey) && project.group === group.key);
          if (!projects.length) return "";
          return `
            <section class="project-group" aria-labelledby="group-${businessKey}-${group.key}">
              <div class="project-group__head">
                <h2 id="group-${businessKey}-${group.key}" class="project-group__title">${group.title}</h2>
                <span class="project-group__count">${projects.length}</span>
                <p class="project-group__description">${group.description}</p>
              </div>
              <div class="project-list">${projects.map(renderCard).join("")}</div>
            </section>
          `;
        }).join("");
      }

      function selectTab(businessKey) {
        document.querySelectorAll(".business-tab").forEach((tab) => {
          const selected = tab.dataset.business === businessKey;
          tab.setAttribute("aria-selected", String(selected));
          tab.tabIndex = selected ? 0 : -1;
        });
        document.querySelectorAll(".project-groups").forEach((panel) => {
          panel.hidden = panel.dataset.business !== businessKey;
        });
        try {
          localStorage.setItem(TAB_STORAGE_KEY, businessKey);
        } catch {}
      }

      function renderProjects() {
        const tabs = document.getElementById("businessTabs");
        tabs.innerHTML = BUSINESSES.map((business) => {
          const count = PROJECTS.filter((project) => project.businesses.includes(business.key)).length;
          return `
            <button class="business-tab" type="button" role="tab" id="tab-${business.key}" data-business="${business.key}" aria-controls="panel-${business.key}">
              ${business.title}<span class="business-tab__count">${count}</span>
            </button>
          `;
        }).join("");

        document.getElementById("businessPanels").innerHTML = BUSINESSES.map(
          (business) => `
            <div class="project-groups" role="tabpanel" id="panel-${business.key}" data-business="${business.key}" aria-labelledby="tab-${business.key}">
              ${renderGroups(business.key)}
            </div>
          `
        ).join("");

        document.getElementById("businessPanels").addEventListener("click", (event) => {
          const button = event.target.closest(".project-card__copy");
          if (button) handleCopy(button);
        });

        tabs.addEventListener("click", (event) => {
          const tab = event.target.closest(".business-tab");
          if (tab) selectTab(tab.dataset.business);
        });
        // 좌우 화살표로 탭 이동
        tabs.addEventListener("keydown", (event) => {
          if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
          const keys = BUSINESSES.map((business) => business.key);
          const current = keys.indexOf(document.activeElement?.dataset.business);
          if (current < 0) return;
          const next = keys[(current + (event.key === "ArrowRight" ? 1 : -1) + keys.length) % keys.length];
          selectTab(next);
          document.getElementById(`tab-${next}`).focus();
        });

        selectTab(readSavedTab());
      }

      function showLogin() {
        document.getElementById("loginScreen").style.display = "flex";
        document.getElementById("accessDenied").style.display = "none";
        document.getElementById("mainContent").style.display = "none";
      }

      function showDenied() {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("accessDenied").style.display = "flex";
        document.getElementById("mainContent").style.display = "none";
      }

      function showMain(user) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("accessDenied").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
        document.getElementById("userEmail").textContent = user.email || "";
      }

      async function syncAccess(session) {
        const user = session?.user || (await window.SsobigAuth.getUser());

        if (!user) {
          showLogin();
          return;
        }

        if (!window.SsobigAuth.isSsobigEmail(user.email)) {
          showDenied();
          setTimeout(() => {
            window.SsobigAuth.signOut();
          }, 1600);
          return;
        }

        showMain(user);
      }

      document.addEventListener("DOMContentLoaded", async () => {
        renderProjects();

        await window.SsobigAuth.waitForSession();
        await syncAccess(await window.SsobigAuth.getSession());

        window.SsobigAuth.onAuthStateChange(async (_event, session) => {
          await syncAccess(session);
        });
      });
    </script>

  <body>
    <div class="page">
      <div class="topbar">
        <a class="topbar__back" href="./index.html">메인으로 돌아가기</a>
        <div class="topbar__title">SSOBIG Members Only</div>
      </div>

      <div id="loginScreen" class="login-screen">
        <section class="login-card">
          <h2>쏘빅멤버용 링크</h2>
          <p>@ssobig.com Google 계정으로 로그인한 멤버만 볼 수 있습니다.</p>
          <button class="auth-button" onclick="window.SsobigAuth.signIn()">Google로 로그인</button>
        </section>
      </div>

      <div id="accessDenied" class="access-denied">
        <section class="access-card">
          <h2>접근할 수 없습니다</h2>
          <p>@ssobig.com 계정만 접근할 수 있습니다. 잠시 후 자동으로 로그아웃됩니다.</p>
        </section>
      </div>

      <main id="mainContent" class="main-content">
        <section class="hero">
          <h1>쏘빅멤버용 링크</h1>
          <p>내부 운영용 프로젝트와 관리 페이지를 한 곳에서 확인할 수 있습니다.</p>
        </section>

        <div class="status-row">
          <div>로그인 계정: <span id="userEmail" class="user-email"></span></div>
          <button class="topbar__logout" onclick="window.SsobigAuth.signOut()">로그아웃</button>
        </div>

        <div id="businessTabs" class="business-tabs" role="tablist" aria-label="비즈니스"></div>
        <div id="businessPanels"></div>
        <p id="copyStatus" class="visually-hidden" role="status" aria-live="polite"></p>
      </main>
    </div>
  </body>
</html>
